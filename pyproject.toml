[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convex-ad-jax"
version = "0.1.0"
description = "Geometrically regularized differentiable BCDI phase retrieval, in JAX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "optax>=0.2.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.8", "scikit-image>=0.25", "hdf5plugin>=5.0.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
